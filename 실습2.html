<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
      }

      .equip-name {
        width: 220px;
        border: 1px solid gray;
        padding: 6px;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .alarm-list {
        width: 300px;
        height: 110px;
        border: 1px solid gray;
        padding: 8px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <section>
      <!-- Step 1: 설비 이름 말줄임 -->
      <p class="equip-name">
        3공장 2라인 고속 프레스 성형기 PRS-2000X (2024년식)
      </p>
      <!-- Step 2: 대화(알림) 목록 스크롤 -->
      <div class="alarm-list">
        <p>[09:00] 1호기 가동 시작</p>
        <p>[09:12] 2호기 온도 경고 (85도)</p>
        <p>[09:15] 2호기 정지 — 점검 요청</p>
        <p>[어제] 3호기 정기 점검 완료</p>
        <p>[어제] 원자재 입고 확인</p>
        <p>[그제] 야간 가동 이상 없음</p>
      </div>
    </section>
  </body>
</html>
