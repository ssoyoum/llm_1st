<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cell {
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            padding: 20px;
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(a2,1fr);
            gap: 10px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

    </style>

</head>
<body>
    <section>
        <h2>모바일 퍼스트</h2>
        <div class="grid">
        <div class="cell">1</div>
        <div class="cell">1</div>
        <div class="cell">1</div>
        <div class="cell">1</div>
        <div class="cell">1</div>
        <div class="cell">1</div>
        </div>
</body>
</html>
