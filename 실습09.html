<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .box {
        width: 80px;
        height: 80px;
        background-color: lightblue;
        border: 2px solid black;
        text-align: center;
        line-height: 80px;
      }
      .C{
        position: relative;
        width: 500px;
        height: 500px;
        border: 2px solid gray;
      }
      .d1 {
        position: relative;
        left: 50px;
        top: 30px;
      }

      .d2 {
        position: absolute;
        right: 30px;
        bottom: 100px;
      }
      .d3 {
        position: fixed;
        right: 100px;
        top: 100px;
      }
    </style>
  </head>
  <body>
    
        <div class="C">
      <div class="box d1">1</div>
      <div class="box d2">2</div>
      <div class="box d3">3</div>
    </div>
    </section>
  </body>
</html>
