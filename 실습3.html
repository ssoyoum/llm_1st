<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container-st {
        width: 500px;
        height: 500px;
        background-color: gray;
        display: flex;
        align-content: stretch;
        align-items: stretch;
      }
      .container-c {
        width: 500px;
        height: 500px;
        background-color: gray;
        display: flex;
        align-content: center;
        align-items: center;
      }
      .container-fe {
        width: 500px;
        height: 500px;
        background-color: gray;
        display: flex;
        align-content: flex-end;
        align-items: flex-end;
      }
      .item {
        width: 100px;
        height: 100px;
        background-color: yellow;
        text-align: center;
        line-height: 100px;
        justify-content: space-between;
        align-items: baseline;
      }
    </style>
  </head>
  <body>
    <section>
      <p>streth</p>
      <div class="container-st">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
      </div>
    </section>
    <section>
      <p>center</p>
      <div class="container c">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
      </div>
    </section>
    <section>
      <p>flex-end</p>
      <div class="container-fe">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
      </div>
    </section>
  </body>
</html>
